series:
  - name: Kids' Questions About Life
    slug: kids-questions-about-life
    kind: A children's series on body, mind and soul
    intro: >-
      Each book is a collection of questions and answers — a small encyclopedia
      for any parent or child who wants to know more about the essentials of
      life. The concepts are made tangible through a family of bears living
      their adventures in the great outdoors: as the cubs ask questions, Mommy
      Bear and Daddy Bear answer with simplicity, honesty and hopeful
      positivity.
    languages: English, French and German
    image: /assets/books/kids-series.jpg
    image_alt: The Kids' Questions About Life series
    books:
      - number: One
        title: Hey Buddy, I'm Your Body!
        asin: "0998309826"
        cover: /assets/books/hey-buddy-cover.jpg
        cover_alt: Cover of Hey Buddy, I'm Your Body!
        blurb: >-
          The first installment of the series. An educational book written in
          simple language for parents, teachers and kids who are pondering the
          deeper, more complex, yet so essential issues of life — an early
          introduction to who we are and how to take care of ourselves.
        body:
          - >-
            Explaining the complexity of the human being in general — in this
            book, the human body more specifically — is not an easy but a very
            important task for parents. These concepts are made more tangible
            and easily understandable through a family of bears. As the bear
            cubs ask questions about their bodies, Mommy Bear and Daddy Bear
            seek to answer their little ones with simplicity and honesty.
          - >-
            Emphasizing that we are part of nature and made from the same
            building blocks as everything else in nature helps children
            understand how to take care of their body. The body knows how to
            heal itself, but it needs our help to make informed and wise
            choices for a healthy and happy lifestyle.
        questions:
          - How do we make babies?
          - We are a bunch of cells? What are cells?
          - What do I feed my cells?
          - Why do we need to eat animals?
          - Why do I have to pee?
          - Why do we have to sleep?
          - Why do we get sick?
          - What are germs?
          - How can I fight the germs?
          - Why do some kids get more sick than others?
          - Why can't my friend eat nuts?
          - Why are junk foods even sold?
      - number: Two
        title: Wait for Me! Would You Mind?
        asin: "1947392085"
        cover_alt: Cover of Wait for Me! Would You Mind?
        blurb: >-
          The second installment. An educational book written in simple
          language for parents, teachers and kids who are pondering the deeper,
          more complex but yet so essential issues of life: an early
          introduction to who we are and how the mind works.
        body:
          - >-
            Explaining the complexity of the human mind to children can be quite
            challenging. Abstract concepts, thoughts, ideas, imagination, focus
            and attention are made more tangible and easily understandable
            through a family of bears. As the bear cubs ask questions, Mommy
            Bear and Daddy Bear seek to answer their little ones with simplicity
            and honesty.
          - >-
            The awareness that we perceive the world through our limited senses,
            and that there is more out there than what we initially think, helps
            broaden our horizons and open us up to a greater reality.
          - >-
            Knowing about the mind's way of thinking, and becoming aware of the
            presence of more than we perceive, is essential. The mind becomes
            our tool rather than our identity. We become more capable of
            distancing ourselves, of choosing what we want to believe and what
            kind of information to feed our minds.
      - number: Three
        title: The Little Souls
        asin: "194739214X"
        cover: /assets/books/little-souls-cover.jpg
        cover_alt: Cover of The Little Souls
        blurb: >-
          The third installment. An educational book written in simple language
          for parents, teachers and kids who are pondering the often
          unanswerable issues of life — an early introduction to who we are and
          where we come from.
        body:
          - >-
            Attempting to explain the meaning of life, souls, birth, death and
            the Universal Soul can be quite a challenging task for parents.
            These concepts are made more tangible and easily understandable
            through a family of bears. As the bear cubs ask questions about
            life, Mommy Bear and Daddy Bear seek to answer their little ones
            with honesty and hopeful positivity about the Universe.
          - >-
            The idea that we are all connected to one another — like many stars
            in a galaxy, many droplets of water in an ocean, or many grains of
            sand in a desert — helps translate concepts like good and bad, birth
            and death, and even dreams into something more concrete.

standalone:
  - title: Once You Know
    subtitle: A Guide To Preserving Your Child's Health
    slug: once-you-know
    asin: "1947392603"
    cover: /assets/books/once-you-know-cover.jpg
    cover_alt: Cover of Once You Know
    blurb: >-
      Today's generation of children is the first in history with a shorter
      life expectancy than their parents. Only about a quarter of a person's
      health is down to genetics; the rest is diet, environment and lifestyle —
      which means a great deal of our children's health lies in our hands.
    body:
      - >-
        This book is an invitation to look harder at the cultural influences on
        our children's health, a resource for parents who want to take an active
        role in preserving it, and a guide to the information most of us simply
        never got.
      - >-
        It is not about expensive drugs, supplements or medical intervention. It
        is about nourishment — not just what a child eats, but the total
        nutrition of body, mind and soul — and about how much easier preserving
        health is than curing disease.
    awards:
      - Endorsed by Neale Donald Walsch, author of *Conversations with God*
