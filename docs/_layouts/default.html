<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo -%}
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site">
    <div class="wrap">
      <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <p class="tagline">{{ site.tagline }}</p>
      <nav>
        {%- for s in site.sections %}
        <a href="{{ '/' | append: s.slug | append: '/' | relative_url }}">{{ s.name }}</a>
        {%- endfor %}
      </nav>
    </div>
  </header>

  <main id="main" class="wrap">
    {{ content }}
  </main>

  <footer class="site">
    <div class="wrap">
      <p>&copy; {{ 'now' | date: "%Y" }} {{ site.author }}. All rights reserved.</p>
      <p><a href="{{ '/feed.xml' | relative_url }}">RSS</a></p>
    </div>
  </footer>
  {% include widget.html %}
</body>
</html>
